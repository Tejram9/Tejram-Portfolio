<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#070b14"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer coordinate grid points -->
  <circle cx="8" cy="8" r="1.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="56" cy="8" r="1.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="8" cy="56" r="1.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="56" cy="56" r="1.5" fill="#3b82f6" opacity="0.4"/>
  
  <!-- Outer Hexagonal Frame -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" stroke="#3b82f6" stroke-width="2.5" fill="#0b101c" fill-opacity="0.8"/>
  
  <!-- Connecting Tech vectors -->
  <line x1="32" y1="8" x2="32" y2="24" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="10" y1="44" x2="24" y2="36" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="54" y1="44" x2="40" y2="36" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Central TD Monogram -->
  <text x="32" y="38" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-1">TD</text>
  
  <!-- Dynamic Signal Core dot -->
  <circle cx="44" cy="20" r="3" fill="#38bdf8"/>
  <circle cx="44" cy="20" r="5" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
</svg>

